<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for Gemini orb -->
    <radialGradient id="geminiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.3" />
    </radialGradient>
    
    <!-- Gradient for connections -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Globe gradient -->
    <radialGradient id="globeGradient" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:0.7" />
    </radialGradient>
    
    <!-- Filter for glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Pulse animation -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .float { animation: float 3s ease-in-out infinite; }
      .dash { animation: dash 1s linear infinite; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  
  <!-- Central AI Hub (Gemini representation) -->
  <g class="float">
    <circle cx="400" cy="250" r="80" fill="url(#geminiGlow)" filter="url(#glow)" class="pulse"/>
    <circle cx="400" cy="250" r="60" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>
    <circle cx="400" cy="250" r="45" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Gemini-style icon in center -->
    <g transform="translate(400, 250)">
      <!-- Three interconnected circles representing multimodal -->
      <circle cx="-15" cy="-10" r="12" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="15" cy="-10" r="12" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="0" cy="15" r="12" fill="none" stroke="#fff" stroke-width="2"/>
      <!-- Connecting lines -->
      <line x1="-5" y1="-5" x2="5" y2="-5" stroke="#fff" stroke-width="2"/>
      <line x1="-8" y1="3" x2="-4" y2="10" stroke="#fff" stroke-width="2"/>
      <line x1="8" y1="3" x2="4" y2="10" stroke="#fff" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Connection lines to global nodes -->
  <g stroke="url(#lineGradient)" stroke-width="2" fill="none" class="dash" stroke-dasharray="5,5">
    <!-- To Factory (China) -->
    <path d="M 320 250 Q 200 200 120 150"/>
    <!-- To Ship -->
    <path d="M 400 330 Q 350 400 200 420"/>
    <!-- To Globe (right) -->
    <path d="M 480 250 Q 550 200 650 180"/>
    <!-- To Documents -->
    <path d="M 400 170 Q 450 100 550 80"/>
    <!-- To Analytics -->
    <path d="M 320 290 Q 250 350 150 380"/>
    <!-- To Communication -->
    <path d="M 480 290 Q 550 350 680 380"/>
  </g>
  
  <!-- Factory Icon (Manufacturing/China) -->
  <g transform="translate(80, 110)" filter="url(#glow)">
    <rect x="0" y="20" width="80" height="50" fill="#f97316" rx="3"/>
    <rect x="10" y="0" width="15" height="40" fill="#fb923c"/>
    <rect x="55" y="5" width="15" height="35" fill="#fb923c"/>
    <rect x="30" y="10" width="20" height="30" fill="#fdba74"/>
    <!-- Smoke -->
    <circle cx="17" cy="-10" r="5" fill="#94a3b8" opacity="0.6"/>
    <circle cx="62" cy="-5" r="4" fill="#94a3b8" opacity="0.5"/>
  </g>
  
  <!-- Shipping Container Icon -->
  <g transform="translate(150, 390)" filter="url(#glow)">
    <rect x="0" y="0" width="100" height="50" fill="#0ea5e9" rx="5"/>
    <line x1="25" y1="0" x2="25" y2="50" stroke="#0284c7" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="50" stroke="#0284c7" stroke-width="2"/>
    <line x1="75" y1="0" x2="75" y2="50" stroke="#0284c7" stroke-width="2"/>
    <!-- Waves underneath -->
    <path d="M -10 55 Q 15 50 40 55 Q 65 60 90 55 Q 115 50 140 55" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Globe Icon (Global Markets) -->
  <g transform="translate(620, 140)" filter="url(#glow)">
    <circle cx="40" cy="40" r="40" fill="url(#globeGradient)"/>
    <ellipse cx="40" cy="40" rx="40" ry="15" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <ellipse cx="40" cy="40" rx="15" ry="40" fill="none" stroke="#86efac" stroke-width="1.5"/>
    <line x1="0" y1="40" x2="80" y2="40" stroke="#86efac" stroke-width="1.5"/>
    <!-- Location markers -->
    <circle cx="25" cy="25" r="4" fill="#fbbf24"/>
    <circle cx="55" cy="50" r="4" fill="#fbbf24"/>
    <circle cx="60" cy="30" r="4" fill="#fbbf24"/>
  </g>
  
  <!-- Document/Contract Icon -->
  <g transform="translate(520, 50)" filter="url(#glow)">
    <rect x="0" y="0" width="60" height="75" fill="#f1f5f9" rx="3"/>
    <rect x="0" y="0" width="60" height="20" fill="#a855f7" rx="3"/>
    <line x1="10" y1="30" x2="50" y2="30" stroke="#94a3b8" stroke-width="2"/>
    <line x1="10" y1="40" x2="45" y2="40" stroke="#94a3b8" stroke-width="2"/>
    <line x1="10" y1="50" x2="50" y2="50" stroke="#94a3b8" stroke-width="2"/>
    <line x1="10" y1="60" x2="35" y2="60" stroke="#94a3b8" stroke-width="2"/>
    <!-- Checkmark -->
    <path d="M 40 55 L 45 62 L 55 48" stroke="#22c55e" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Analytics/Chart Icon -->
  <g transform="translate(100, 350)" filter="url(#glow)">
    <rect x="0" y="0" width="70" height="55" fill="#1e293b" stroke="#64748b" stroke-width="1" rx="3"/>
    <rect x="10" y="35" width="10" height="15" fill="#22c55e"/>
    <rect x="25" y="20" width="10" height="30" fill="#3b82f6"/>
    <rect x="40" y="10" width="10" height="40" fill="#f97316"/>
    <rect x="55" y="25" width="10" height="25" fill="#a855f7"/>
  </g>
  
  <!-- Communication/Message Icon -->
  <g transform="translate(650, 350)" filter="url(#glow)">
    <rect x="0" y="0" width="70" height="50" fill="#3b82f6" rx="8"/>
    <circle cx="20" cy="25" r="5" fill="#fff"/>
    <circle cx="35" cy="25" r="5" fill="#fff"/>
    <circle cx="50" cy="25" r="5" fill="#fff"/>
    <!-- Speech bubble tail -->
    <polygon points="55,45 70,60 60,45" fill="#3b82f6"/>
  </g>
  
  <!-- Language icons floating around -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <text x="150" y="280" fill="#fbbf24">EN</text>
    <text x="600" y="260" fill="#fbbf24">中</text>
    <text x="280" y="180" fill="#fbbf24">ES</text>
    <text x="520" y="320" fill="#fbbf24">AR</text>
    <text x="350" y="380" fill="#fbbf24">FR</text>
    <text x="480" y="150" fill="#fbbf24">DE</text>
  </g>
  
  <!-- Data flow particles -->
  <g fill="#60a5fa">
    <circle cx="250" cy="220" r="3" class="pulse"/>
    <circle cx="180" cy="180" r="2" class="pulse"/>
    <circle cx="550" cy="220" r="3" class="pulse"/>
    <circle cx="620" cy="200" r="2" class="pulse"/>
    <circle cx="300" cy="350" r="2" class="pulse"/>
    <circle cx="500" cy="350" r="3" class="pulse"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">
    Gemini 3 Pro: Powering Global Trade with AI Intelligence
  </text>
</svg>